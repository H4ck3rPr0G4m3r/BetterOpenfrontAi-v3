[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ofai"
version = "0.1.0"
description = "OpenFront AI v3: data, model, training and evaluation"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ofai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
